<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoulda Listened to Your Math Teacher</title>
<meta name="description" content="A 1990s arcade game: walk home, and answer the SAT math question when the car pulls up.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: monospace; color: #777; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #screen { position: relative; background: #000; }
  #screen canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* A CRT: one dark scanline per arcade line, and darker corners. */
  #crt {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent var(--half, 2px), rgba(0, 0, 0, .25) var(--half, 2px), rgba(0, 0, 0, .25) var(--line, 3px));
    box-shadow: inset 0 0 80px rgba(0, 0, 0, .55);
  }
  #crt.off { background: none; }
  /* Touch controls: an arcade panel under the screen (sideways: in the margins beside it). */
  #pad { display: none; width: 100%; max-width: 640px; padding: 8px 14px 6px; box-sizing: border-box;
    grid-template-areas: "sys sys" "move act"; grid-template-columns: 1fr 1fr; row-gap: 10px; }
  body.touch #pad { display: grid; }
  #pad .grp { display: flex; gap: 12px; align-items: center; }
  #pad .sysrow { grid-area: sys; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  #pad .move { grid-area: move; justify-self: start; }
  #pad .act { grid-area: act; justify-self: end; }
  body.land #pad { position: fixed; inset: 0; max-width: none; padding: 0; display: block; pointer-events: none; }
  body.land #pad > * { position: absolute; pointer-events: auto; }
  body.land #pad .move { left: max(10px, env(safe-area-inset-left)); bottom: 14px; }
  body.land #pad .act { right: max(10px, env(safe-area-inset-right)); bottom: 14px; }
  body.land #pad .sysrow { right: max(10px, env(safe-area-inset-right)); top: 10px; width: 116px; justify-content: flex-end; }
  /* Small phones sideways: slim columns, the arrows one above the other, so the game stays big. */
  body.land.slim #pad .move, body.land.slim #pad .act { flex-direction: column; gap: 8px; bottom: 10px; }
  body.land.slim #pad .move { left: max(6px, env(safe-area-inset-left)); }
  body.land.slim #pad .act { right: max(6px, env(safe-area-inset-right)); }
  body.land.slim #pad button.dir { width: 56px; height: 52px; }
  body.land.slim #pad button.a, body.land.slim #pad button.b { width: 56px; height: 56px; }
  body.land.slim #pad .sysrow { left: max(6px, env(safe-area-inset-left)); right: auto; top: 6px; width: 56px; flex-direction: column; gap: 5px; }
  body.land.slim #pad button.sys { width: 56px; height: 28px; }
  #pad .sysrow button.read { display: none; }
  body.read #pad .sysrow button.read { display: block; background: #2a8a3a; }
  #turn { display: none; font-size: 12px; color: #8a8aa8; padding: 2px 0 6px; text-align: center; }
  body.touch:not(.land) #turn { display: block; }
  #pad button {
    width: 62px; height: 62px; border-radius: 50%; border: 3px solid #222; color: #fff;
    font: bold 15px monospace; touch-action: none; -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .35);
  }
  #pad button.dir { background: #333; border-radius: 12px; width: 58px; }
  #pad button.a { background: #d42020; }
  #pad button.b { background: #2050d4; }
  #pad button.sys { width: 55px; height: 30px; border-radius: 6px; font-size: 11px; background: #555; }
  #pad button.on { filter: brightness(1.5); box-shadow: inset 0 3px 0 rgba(0, 0, 0, .35); }
</style>
</head>
<body>
<div id="screen"><canvas id="game" width="384" height="224"></canvas><div id="crt"></div></div>
<div id="pad">
  <div class="sysrow"><button class="sys" data-act="coin">COIN</button><button class="sys" data-act="start">START</button><button class="sys" data-act="mute">SOUND</button><button class="sys" data-act="pause">MENU</button><button class="sys read" data-act="read">READ</button></div>
  <div class="grp move"><button class="dir" data-act="left">&#9664;</button><button class="dir" data-act="right">&#9654;</button></div>
  <div class="grp act"><button class="b" data-act="calc">B</button><button class="a" data-act="fire">A</button></div>
</div>
<div id="turn">Turn your phone sideways for a bigger screen.</div>

</html>
