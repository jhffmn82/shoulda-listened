<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoulda Listened to Your Math Teacher</title>
<meta name="description" content="A 1990s arcade game: walk home, and answer the SAT math question when the car pulls up.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: monospace; color: #777; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #screen { position: relative; background: #000; }
  #screen canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  /* A CRT: one dark scanline per arcade line, and darker corners. */
  #crt {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0, transparent var(--half, 2px), rgba(0, 0, 0, .25) var(--half, 2px), rgba(0, 0, 0, .25) var(--line, 3px));
    box-shadow: inset 0 0 80px rgba(0, 0, 0, .55);
  }
  #crt.off { background: none; }
  #help { font-size: 11px; padding: 6px 8px 0; text-align: center; line-height: 1.5; }
  #help b { color: #bbb; font-weight: normal; }
  /* Touch controls: an arcade panel under the screen. */
  #pad { display: none; width: 100%; max-width: 640px; justify-content: space-between; align-items: center; padding: 10px 14px; box-sizing: border-box; }
  body.touch #pad { display: flex; }
  body.touch #help { display: none; }
  body.land #pad { position: fixed; left: 0; right: 0; bottom: 0; max-width: none; opacity: .55; }
  #pad .grp { display: flex; gap: 12px; align-items: center; }
  #pad button {
    width: 62px; height: 62px; border-radius: 50%; border: 3px solid #222; color: #fff;
    font: bold 15px monospace; touch-action: none; -webkit-tap-highlight-color: transparent;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .35);
  }
  #pad button.dir { background: #333; border-radius: 12px; width: 58px; }
  #pad button.a { background: #d42020; }
  #pad button.b { background: #2050d4; }
  #pad button.sys { width: 50px; height: 30px; border-radius: 6px; font-size: 11px; background: #555; }
  #pad button.on { filter: brightness(1.5); box-shadow: inset 0 3px 0 rgba(0, 0, 0, .35); }
</style>
</head>
<body>
<div id="screen"><canvas id="game" width="384" height="224"></canvas><div id="crt"></div></div>
<div id="pad">
  <div class="grp"><button class="dir" data-act="left">&#9664;</button><button class="dir" data-act="right">&#9654;</button></div>
  <div class="grp" style="flex-direction: column; gap: 8px"><button class="sys" data-act="coin">COIN</button><button class="sys" data-act="start">START</button></div>
  <div class="grp"><button class="b" data-act="calc">B</button><button class="a" data-act="fire">A</button></div>
</div>
<div id="help">
  <b>5</b> coin &middot; <b>1</b> or <b>Enter</b> start &middot; <b>&larr; &rarr;</b> walk &middot; <b>Z</b> kick &middot;
  <b>A B C D</b> or <b>1&ndash;4</b> answer &middot; <b>X</b> calculator &middot; <b>P</b> Parent Mode &middot; <b>M</b> mute &middot; <b>F</b> full screen &middot; <b>Esc</b> pause
</div>
<script src="js/core.js"></script>
<script src="js/font.js"></script>
<script src="js/data/sprites.js"></script>
<script src="js/data/voices.js"></script>
<script src="js/art.js"></script>
<script src="js/figures.js"></script>
<script src="js/questions.js"></script>
<script src="js/grades/k2.js"></script>
<script src="js/grades/g35.js"></script>
<script src="js/grades/g68.js"></script>
<script src="js/grades/hs.js"></script>
<script src="js/grades/sat.js"></script>
<script src="js/quiz.js"></script>
<script src="js/sound.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
